name: Build Kernel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu‑latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch‑depth: 0

      - name: Install build dependencies
        run: |
          sudo apt‑get update
          sudo apt‑get install‑y build‑essential libssl‑dev bc bison flex libelf‑dev gcc‑aarch64‑linux‑gnu

      - name: Build kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64‑linux‑gnu‑
          make O=out gki_defconfig
          make O=out -j$(nproc)

      - name: Upload kernel artifact
        uses: actions/upload‑artifact@v4
        with:
          name: kernel‑build
          path: out/arch/arm64/boot/
