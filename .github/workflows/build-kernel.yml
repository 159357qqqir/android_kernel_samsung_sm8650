name: Build Kernel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install basic dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio gcc make python3

      - name: Create 8G Swap space
        run: |
          sudo dd if=/dev/zero of=/swapfile bs=1G count=8 status=progress
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Setup Google Android Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: 17
          directory: ${{ github.workspace }}/llvm

      - name: Build kernel with Clang
        run: |
          export ARCH=arm64
          export PATH=${{ github.workspace }}/llvm/bin:$PATH
          make O=out gki_defconfig LLVM=1
          make O=out LLVM=1 -j1

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: out/arch/arm64/boot/
