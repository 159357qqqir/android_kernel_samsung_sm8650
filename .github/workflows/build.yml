name: Build SM8650 S24 Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🔧 开启16G Swap防止LTO爆内存
        run: |
          SWAPFILE="/tmp/swapfile"
          sudo dd if=/dev/zero of="$SWAPFILE" bs=1G count=16 status=none
          sudo chmod 600 "$SWAPFILE"
          sudo mkswap "$SWAPFILE"
          sudo swapon "$SWAPFILE"
          free -h

      - name: 📥 拉取内核源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 📦 下载Proton Clang工具链
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: 🧩 安装完整编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential bc bison flex libssl-dev libelf-dev libncurses-dev python3 python3-pip

      - name: 🔍 查看现有的内核defconfig（调试用）
        run: ls arch/arm64/configs/

      - name: ⚙️ 编译内核 -j2
        run: |
          export PATH="$PWD/clang/bin:$PATH"
          export ARCH=arm64
          export CC=clang
          export LD=lld
          export LLVM=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          # =========这里！把 build_config.aarch64 替换成你ls出来真实的文件名！=========
          make sm8650_defconfig
          make -j2
