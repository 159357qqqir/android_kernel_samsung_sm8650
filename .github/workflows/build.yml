name: Build SM8650 S24 Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 🔧 开启16G Swap防止LTO爆内存
        run: |
          SWAPFILE="/tmp/swapfile"
          sudo dd if=/dev/zero of="$SWAPFILE" bs=1G count=16 status=none
          sudo chmod 600 "$SWAPFILE"
          sudo mkswap "$SWAPFILE"
          sudo swapon "$SWAPFILE"
          free -h

      - name: 📥 拉取内核源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 📦 下载Proton Clang工具链
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: 🧩 安装完整编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential bc bison flex libssl-dev libelf-dev libncurses-dev python3 python3-pip

      - name: 🔍 查看kernelconfigs里面的配置文件
        run: ls kernelconfigs/

      - name: ⚙️ 编译内核 -j2
        run: |
          CLANG_BIN="$PWD/clang/bin"
          export ARCH=arm64
          export CC="$CLANG_BIN/clang"
          export LD="$CLANG_BIN/ld.lld"
          export LLVM=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE="$CLANG_BIN/aarch64-linux-gnu-"
          export HOSTCC=gcc
          export HOSTCXX=g++
          
          # =====重点！这个源码配置文件在kernelconfigs，不是arch/arm64/configs=====
          cp kernelconfigs/s24_defconfig .config
          make olddefconfig
          make -j2

      - name: 📂 检查编译输出
        run: ls -la arch/arm64/boot/

      - name: 📁 打包编译产物
        run: |
          mkdir -p out
          cp arch/arm64/boot/Image out/
          cp arch/arm64/boot/dts/vendor/qcom/*.dtb out/
          cp arch/arm64/boot/dts/vendor/qcom/*.dtbo out/
          tar -Jcf kernel-out.tar.xz out

      - name: 📤 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: S24-SM8650-Kernel
          path: kernel-out.tar.xz
