name: Build Kernel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install basic dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libelf-dev libssl-dev git

      - name: Setup Google Android Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18"
          env: true

      - name: Build kernel with Clang
        run: |
          export ARCH=arm64
          export CC=clang
          make O=out gki_defconfig
          make O=out -j$(nproc)

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: out/arch/arm64/boot/

