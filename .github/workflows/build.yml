name: Build SM8650 S24 Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🔧 开启16G Swap防止LTO爆内存
        run: |
          sudo dd if=/dev/zero of=/swapfile bs=1G count=16 status=none
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: 📥 拉取内核源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 📦 下载Proton Clang工具链
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: 🧩 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential bc bison flex libssl-dev libelf-dev

      - name: ⚙️ 编译内核 -j4
        run: |
          export PATH=$PWD/clang/bin:$PATH
          make -j4 ARCH=arm64 CC=clang LD=lld LLVM=1 build_config.aarch64
          make -j4 ARCH=arm64 CC=clang LD=lld LLVM=1

      - name: 📁 打包编译产物
        run: |
          mkdir -p out
          cp arch/arm64/boot/Image out/
          cp arch/arm64/boot/dts/vendor/qcom/*.dtb out/
          cp arch/arm64/boot/dts/vendor/qcom/*.dtbo out/
          tar -Jcf kernel-out.tar.xz out

      - name: 📤 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: S24-SM8650-Kernel
          path: kernel-out.tar.xz
