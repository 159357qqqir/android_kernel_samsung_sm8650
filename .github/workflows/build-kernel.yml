name: Build Kernel

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Download Android Clang
        run: |
          mkdir -p llvm
          cd llvm
          wget https://dl.google.com/android/ndk/android‑clang‑r487747‑linux‑x86.tar.zst
          tar -I zstd -xvf android‑clang‑r487747‑linux‑x86.tar.zst

      - name: Build kernel with Clang
        run: |
          export ARCH=arm64
          export PATH=${{ github.workspace }}/llvm/bin:$PATH
          make O=out gki_defconfig LLVM=1
          make O=out LLVM=1 -j3

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-out
          path: out/arch/arm64/boot/
